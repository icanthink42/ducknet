name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ducknet-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next patch version
        id: version
        shell: bash
        run: |
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ -z "$latest" ]]; then
            next="v0.1.0"
          else
            version="${latest#v}"
            IFS=. read -r major minor patch <<< "$version"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Test
        run: lua tests/run.lua .

      - name: Build self-contained installer
        run: python3 scripts/build_release.py "${{ steps.version.outputs.version }}"

      - name: Validate bundled installer syntax
        run: luac -p dist/ducknet-installer.lua

      - name: Test installer profiles
        run: lua tests/installer_profiles.lua dist/ducknet-installer.lua

      - name: Tag tested commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" "$GITHUB_SHA" -m "DuckNet $VERSION"
          git push origin "$VERSION"

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" dist/ducknet-installer.lua --notes-file .github/release-notes.md --verify-tag
